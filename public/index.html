<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OsmoBank — Bank to the Future</title>
<meta name="description" content="OsmoBank is a decentralized bank owned by its members. Wallets, transfers, cards, ventures and DAO governance in one vault.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 27 20'%3E%3Ccircle cx='8.5' cy='9.5' r='7.5' fill='none' stroke='%230a0a0a' stroke-width='2'/%3E%3Ccircle cx='16.5' cy='9.5' r='7.5' fill='none' stroke='%230a0a0a' stroke-width='2'/%3E%3Ccircle cx='13.5' cy='10' r='2' fill='%23c47b10'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Doto:wght@600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#f4f4f4;font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:#e0342b}
input,select{outline:none}
@keyframes ob-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ob-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ob-pulse{0%{box-shadow:0 0 0 0 rgba(196,123,16,.45)}70%{box-shadow:0 0 0 11px rgba(196,123,16,0)}100%{box-shadow:0 0 0 0 rgba(196,123,16,0)}}
</style>
</head>
<body>
<div id="ob-root">
<div style="min-height:100vh;background:var(--bg,#f4f4f4);color:var(--ink,#0a0a0a)">

<!-- ================================ HOME ================================ -->
<div data-if="isHome" style="display:none" data-partial="home"></div>

<!-- ================================ LOGIN ================================ -->
<div data-if="isLogin" style="display:none" data-partial="login"></div>

<!-- ================================ SIGNUP ================================ -->
<div data-if="isSignup" style="display:none" data-partial="signup"></div>

<!-- ================================ DASHBOARD ================================ -->
<div data-if="isDash" style="display:none" data-partial="dash"></div>

<!-- ================================ WALLETS ================================ -->
<div data-if="isWallets" style="display:none" data-partial="wallets"></div>

<!-- ================================ TRANSFER ================================ -->
<div data-if="isTransfer" style="display:none" data-partial="transfer"></div>

<!-- ================================ CARDS + GIFT STORE ================================ -->
<div data-if="isCards" style="display:none" data-partial="cards"></div>

<!-- ================================ VENTURES ================================ -->
<div data-if="isVentures" style="display:none" data-partial="ventures"></div>

<!-- ================================ INVESTOR'S EDGE ================================ -->
<div data-if="isEdge" style="display:none" data-partial="edge"></div>

<!-- ================================ INVEST MODAL ================================ -->
<div data-if="investOpen" style="display:none">
<div style="position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px" data-action="closeInvest" role="button" tabindex="0">
  <div style="width:min(440px,94vw);background:var(--sf,#fff);border:1px solid var(--hr,#e4e4e4);border-radius:22px;padding:26px" data-action="stopClick" role="button" tabindex="0">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mut,#757575)"><span style="font-family:'Material Symbols Sharp';font-size:16px;line-height:1">diamond</span>STAKE TOKENS</div>
      <span data-action="closeInvest" role="button" tabindex="0" style="font-family:'Material Symbols Sharp';font-size:20px;line-height:1;cursor:pointer;color:var(--mut,#757575)" class="obh-0">close</span>
    </div>
    <div style="font-family:'Doto',monospace;font-weight:900;font-size:26px;margin-top:12px;letter-spacing:.02em"><span data-text="investName"></span></div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--grn,#17a562);margin-top:4px"><span data-text="investApy"></span>% APY · DIVIDENDS AUTO-PAID TO YOUR VAULT</div>
    <div style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mut,#757575);margin-bottom:8px"><span>AMOUNT</span><span data-slot="invest.max" data-action="investMax" role="button" tabindex="0" style="color:var(--red,#c47b10);cursor:pointer">MAX $12,450</span></div>
      <div style="display:flex;align-items:baseline;gap:10px;border:1px solid var(--dt,#d9d9d9);border-radius:14px;padding:14px 16px">
        <span style="font-family:'Doto',monospace;font-weight:900;font-size:26px;color:var(--fnt,#a3a3a3)">$</span>
        <input data-slot="invest.amount" placeholder="500" inputmode="decimal" style="flex:1;min-width:0;border:none;background:transparent;color:var(--ink,#0a0a0a);font-family:'Doto',monospace;font-weight:900;font-size:28px;padding:0" />
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mut,#757575)">FROM USDC</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:7px;margin-top:16px;padding-top:14px;border-top:1px dotted var(--dt2,#c6c6c6);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mut,#757575)">
      <div style="display:flex;justify-content:space-between"><span>LOCKUP</span><span style="color:var(--ink,#0a0a0a)">NONE · EXIT ANYTIME</span></div>
      <div style="display:flex;justify-content:space-between"><span>PLATFORM FEE</span><span style="color:var(--ink,#0a0a0a)">0.5% → DAO TREASURY</span></div>
      <div style="display:flex;justify-content:space-between"><span>EST. QUARTERLY DIVIDEND</span><span style="color:var(--grn,#17a562)">$15.50 / $500</span></div>
    </div>
    <div style="display:flex;gap:9px;margin-top:20px">
      <div data-action="confirmInvest" role="button" tabindex="0" style="flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 0;background:var(--ink,#0a0a0a);color:var(--inv,#fff);border-radius:100px;font-size:14px;font-weight:600;cursor:pointer" class="obh-3"><span style="font-family:'Material Symbols Sharp';font-size:16px;line-height:1">check</span>Confirm stake</div>
      <div data-action="closeInvest" role="button" tabindex="0" style="padding:13px 20px;border:1px solid var(--dt,#d9d9d9);border-radius:100px;font-size:14px;font-weight:600;cursor:pointer" class="obh-2">Cancel</div>
    </div>
  </div>
</div>
</div>

<!-- ================================ REPORTS ================================ -->
<div data-if="isReports" style="display:none" data-partial="reports"></div>

<!-- ================================ GOALS ================================ -->
<div data-if="isGoals" style="display:none" data-partial="goals"></div>

<!-- ================================ GOVERNANCE ================================ -->
<div data-if="isGov" style="display:none" data-partial="gov"></div>

<!-- ================================ FUNDRAISER ================================ -->
<div data-if="isFund" style="display:none" data-partial="fund"></div>

<!-- ================================ ADMIN ================================ -->
<div data-if="isAdmin" style="display:none" data-partial="admin"></div>

<div data-if="toastOn" style="display:none">
  <div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;background:var(--ink,#0a0a0a);color:var(--inv,#fff);border-radius:100px;padding:12px 24px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.06em;display:flex;align-items:center;gap:9px;box-shadow:0 8px 30px rgba(0,0,0,.25)"><span data-slot="toast.dot" style="width:6px;height:6px;border-radius:50%;background:var(--grn,#17a562);display:inline-block"></span><span data-text="toast"></span></div>
</div>

</div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
