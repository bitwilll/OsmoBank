<div data-screen-label="Login" style="min-height:100vh;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,4vw,48px)">
    <div data-action="goHome" role="button" tabindex="0" style="display:flex;align-items:center;gap:10px;cursor:pointer">
      <div style="position:relative;width:27px;height:20px">
        <div style="position:absolute;left:0;top:1px;width:17px;height:17px;border:2px solid var(--ink,#0a0a0a);border-radius:50%"></div>
        <div style="position:absolute;left:8px;top:1px;width:17px;height:17px;border:2px solid var(--ink,#0a0a0a);border-radius:50%"></div>
        <div style="position:absolute;left:11.5px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--red,#e0342b)"></div>
      </div>
      <div style="font-size:16px;font-weight:700">Osmo<span style="font-weight:400">Bank</span></div>
    </div>
    <div data-action="goHome" role="button" tabindex="0" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:var(--mut,#757575);cursor:pointer" class="obh-0">← BACK</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="width:min(420px,92vw)">
      <div style="text-align:center">
        <div style="font-family:'Doto',monospace;font-weight:900;font-size:34px;letter-spacing:.02em">WELCOME BACK</div>
        <div style="font-size:14px;color:var(--mut,#757575);margin-top:8px">Unlock your vault.</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sf,#fff);border:1px solid var(--hr,#e4e4e4);border-radius:100px;padding:4px;margin-top:24px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em">
        <div data-if="authMember" style="display:none">
          <div style="text-align:center;padding:9px 0;border-radius:100px;background:var(--ink,#0a0a0a);color:var(--inv,#fff);cursor:pointer">MEMBER</div>
          <div data-action="setAuthAdmin" role="button" tabindex="0" style="text-align:center;padding:9px 0;border-radius:100px;color:var(--mut,#757575);cursor:pointer" class="obh-0">ADMIN</div>
        </div>
        <div data-if="authAdmin" style="display:none">
          <div data-action="setAuthMember" role="button" tabindex="0" style="text-align:center;padding:9px 0;border-radius:100px;color:var(--mut,#757575);cursor:pointer" class="obh-0">MEMBER</div>
          <div style="text-align:center;padding:9px 0;border-radius:100px;background:var(--red,#e0342b);color:#fff;cursor:pointer">ADMIN</div>
        </div>
      </div>
      <div style="background:var(--sf,#fff);border:1px solid var(--hr,#e4e4e4);border-radius:20px;padding:24px;margin-top:14px;display:flex;flex-direction:column;gap:14px">
        <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mut,#757575);margin-bottom:7px">EMAIL OR @HANDLE</div>
          <input placeholder="amara@osmo.money" style="width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid var(--dt,#d9d9d9);border-radius:12px;background:var(--bg,#f4f4f4);color:var(--ink,#0a0a0a);font-family:'IBM Plex Mono',monospace;font-size:13.5px" />
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mut,#757575);margin-bottom:7px"><span>PASSPHRASE</span><span style="cursor:pointer" class="obh-4">FORGOT?</span></div>
          <input type="password" placeholder="••••••••••••" style="width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid var(--dt,#d9d9d9);border-radius:12px;background:var(--bg,#f4f4f4);color:var(--ink,#0a0a0a);font-family:'IBM Plex Mono',monospace;font-size:13.5px" />
        </div>
        <div data-action="submitLogin" role="button" tabindex="0" style="padding:14px 0;text-align:center;background:var(--ink,#0a0a0a);color:var(--inv,#fff);border-radius:100px;font-size:14.5px;font-weight:600;cursor:pointer" class="obh-3">Unlock vault<span style="font-family:'Material Symbols Sharp';font-size:16px;line-height:1;vertical-align:-3px;margin-left:7px">lock_open</span></div>
        <div style="display:flex;align-items:center;gap:12px;color:var(--fnt,#a3a3a3);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em"><div style="flex:1;border-top:1px dotted var(--dt2,#c6c6c6)"></div>OR<div style="flex:1;border-top:1px dotted var(--dt2,#c6c6c6)"></div></div>
        <div data-action="passkeyLogin" role="button" tabindex="0" style="padding:13px 0;text-align:center;border:1px solid var(--dt,#d9d9d9);border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px" class="obh-2"><span style="font-family:'Material Symbols Sharp';font-size:18px;line-height:1">passkey</span>Sign in with a passkey</div>
      </div>
      <div style="text-align:center;font-size:13.5px;color:var(--mut,#757575);margin-top:16px">New here? <span data-action="goSignup" role="button" tabindex="0" style="font-weight:600;color:var(--ink,#0a0a0a);cursor:pointer;border-bottom:1px dotted var(--dt2,#c6c6c6)" class="obh-4">Become a member-owner</span></div>
      <div style="text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--fnt,#a3a3a3);margin-top:22px">2FA + PASSKEYS SUPPORTED · KEYS NEVER LEAVE YOUR DEVICE</div>
    </div>
  </div>
</div>
